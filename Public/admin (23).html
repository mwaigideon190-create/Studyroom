<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Studyroom Admin</title>
<style>
:root{--bg:#ffffff;--cd:#fff;--tx:#1d1340;--mu:#6b6590;--pr:#4a1bc4;--pl:#e4dbff;--bd:#d9cfff;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app,.wrap{max-width:520px;margin:0 auto}.wrap{padding:18px 18px 24px}.wrap.pn{padding-bottom:100px}
h1{font-size:30px;font-weight:800;margin:0;color:var(--pr)}h2{font-size:26px;font-weight:800;margin:6px 0 14px;color:var(--pr)}h3{font-size:19px;margin:20px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;padding:14px 18px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--pr);color:var(--pr);display:grid;place-items:center;font-weight:800;font-size:20px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.f{background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;padding:9px 14px;margin:12px 0}.f label{display:block;margin:0 0 2px;font-size:14px;font-weight:700;color:var(--tx)}
.f input,.f select{border:0;padding:3px 0;background:transparent;outline:0;color:var(--tx);width:100%;font:inherit;box-sizing:border-box}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font:inherit}
.sb{border-radius:16px;background:var(--pl);border:0}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--pr);color:#fff;font:700 17px system-ui}
button.g,button.o{background:var(--cd);color:var(--pr);border:1.5px solid var(--pr)}button.s{width:auto;padding:7px 14px;margin:0;font-size:14px;border-radius:10px}
.er{color:var(--er);min-height:1.2em;font-size:14px;margin:6px 0 0}.note{background:var(--pl);border-radius:14px;padding:12px;font-size:14px}
.big{font-size:30px;font-weight:800}.mu{color:var(--mu);font-size:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}.row:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .c{margin:0}
.splash{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.splash p{margin:4px 0;color:var(--tx)}
.seg{display:flex;background:var(--pl);border-radius:14px;padding:4px;gap:4px}.seg button{margin:0;padding:10px;background:none;color:var(--pr);font-size:15px}.seg button.on{background:var(--pr);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:12px;background:var(--cd);border:1.5px solid var(--bd);color:var(--pr);font-weight:700;font-size:14px;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}.th{height:80px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:32px}
.hero{background:linear-gradient(135deg,#4a1bc4,#7b4dff);color:#fff;border-radius:22px;padding:22px;margin:8px 0 14px}.hero .big,.hero .mu{color:#fff}
.ok{width:92px;height:92px;border-radius:50%;background:var(--pl);display:grid;place-items:center;margin:20px auto 10px;font-size:44px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;max-width:520px;margin:0 auto;background:var(--pl);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{width:auto;margin:0;background:none;color:var(--mu);padding:6px 16px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font:600 12px system-ui}.nav button span{font-size:22px}.nav button.on{background:var(--pr);color:#fff}
</style></head>
<body><div id="app"></div><script>
const $=s=>document.querySelector(s),v=i=>$("#"+i).value.trim(),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=n=>"KES "+Number(n||0).toLocaleString();
let T=sessionStorage.getItem("sr_a"),D,tab=0;
async function api(p,b){const r=await fetch("/api/admin/"+p,{method:b===undefined?"GET":"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(T||"")},body:b===undefined?undefined:JSON.stringify(b)});
const d=await r.json().catch(()=>({}));if(r.status==401&&T){out();throw new Error("Please log in again.")}if(!r.ok)throw new Error(d.error||"Failed.");return d}
const R=(x,n)=>{$("#app").innerHTML=`<div class="wrap${n?" pn":""}">${x}</div>${n||""}`};
const NAV=[["📊","Overview"],["👥","Affiliates"],["💬","Complaints"],["💸","Payouts"]];
const nav=a=>`<nav class="nav">${NAV.map((x,i)=>`<button class="${i==a?"on":""}" onclick="tab=${i};show()"><span>${x[0]}</span>${x[1]}</button>`).join("")}</nav>`;
function out(){T=null;sessionStorage.removeItem("sr_a");loginView()}
function loginView(){R(`<div class="splash"><h1 style="font-size:36px">Studyroom</h1><p>Admin</p></div><div class="f"><label>Email</label><input id="em" type="email" placeholder="Admin email"></div>
<div class="f"><label>Password</label><input id="pw" type="password" placeholder="Admin password"></div><p id="er" class="er"></p><button onclick="doLogin()">Log In</button>`)}
async function doLogin(){try{const d=await api("login",{email:v("em"),password:$("#pw").value});T=d.token;sessionStorage.setItem("sr_a",T);load()}catch(e){$("#er").textContent=e.message}}
async function act(p,b){try{await api(p,b);await load()}catch(e){alert(e.message)}}
async function load(){D=await api("summary");show()}
function show(){const d=D,pend=d.affs.filter(a=>!a.approved);let h="";
if(tab==0)h=`<div class="grid"><div class="c"><span class="mu">Main account</span><div class="big">${K(d.general)}</div></div><div class="c"><span class="mu">Affiliate accounts</span><div class="big">${K(d.owed)}</div></div>
<div class="c"><span class="mu">Admin account</span><div class="big">${K(d.adminBal)}</div></div><div class="c"><span class="mu">Paid to affiliates</span><div class="big">${K(d.paidout)}</div></div></div>
<p class="mu">${d.students} paying students · ${d.used} of 5000 codes used</p>
<div class="c"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${d.auto?"checked":""} onchange="act('auto',{on:this.checked})"> AI approves affiliates automatically</label></div>
<h3>Pending requests (${pend.length})</h3><div class="c">${pend.map(a=>`<div class="row"><span>${esc(a.email)}</span><button class="s" onclick="act('approve/${a.id}',{})">Approve</button></div>`).join("")||`<span class="mu">None.</span>`}</div>
<h3>Move to admin account</h3><div class="f"><label>Amount</label><input id="mv" type="number" min="1" placeholder="KES"></div><button onclick="act('transfer',{amount:+$('#mv').value})">Transfer from main account</button>`;
if(tab==1)h=`<h2>Affiliates (${d.affs.length})</h2><div class="c">${d.affs.map(a=>`<div class="row"><span>${esc(a.code||"no code")} · ${esc(a.phone)}</span><b>${K(a.bal)}</b></div>`).join("")||`<span class="mu">None yet.</span>`}</div>`;
if(tab==2)h=`<h2>Complaints</h2>${d.complaints.map(c=>`<div class="c"><b>${esc(c.type)}</b><div class="mu">${esc(c.email)}</div><p>${esc(c.msg)}</p>
${c.status=="Open"?`<div class="f"><label>Amount to credit (0 to just resolve)</label><input id="a${c.id}" type="number" min="0" placeholder="KES"></div><button onclick="act('credit',{id:${c.id},amount:+$('#a${c.id}').value||0})">Settle from main account</button>`:`<b>${esc(c.status)}</b>`}</div>`).join("")||`<p class="mu">No complaints.</p>`}`;
if(tab==3)h=`<h2>Payouts</h2><p class="mu">Automatic every Saturday at 6:00 AM. Next: ${new Date(d.next).toLocaleString()}</p><button onclick="if(confirm('Send all affiliate payouts now?'))act('payout-now',{})">Run payout now</button>
<div class="c">${d.payouts.map(p=>`<div class="row"><span>${esc(p.phone)} · ${esc(p.at)}</span><b>${K(p.amount)} ${esc(p.status)}</b></div>`).join("")||`<span class="mu">No payouts yet.</span>`}</div>`;
R(`<div class="hd"><div><div class="mu">Admin</div><h1>Studyroom</h1></div><button class="g s" onclick="out()">Log out</button></div>`+h,nav(tab))}
setInterval(()=>{if(T&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||""))load().catch(()=>{})},3e4);
T?load().catch(loginView):loginView();
</script></body></html>
