services:
  - type: web
    name: study-room
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: BASE_URL, sync: false }
      - { key: TOKEN_SECRET, generateValue: true }
      - { key: CALLBACK_SECRET, generateValue: true }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_PORT, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASS, sync: false }
      - { key: MPESA_ENV, sync: false }
      - { key: MPESA_KEY, sync: false }
      - { key: MPESA_SECRET, sync: false }
      - { key: MPESA_SHORTCODE, sync: false }
      - { key: MPESA_PASSKEY, sync: false }
      - { key: MPESA_B2C_SHORTCODE, sync: false }
      - { key: MPESA_INITIATOR, sync: false }
      - { key: MPESA_INITIATOR_PASS, sync: false }
      - { key: MPESA_CERT, sync: false }
