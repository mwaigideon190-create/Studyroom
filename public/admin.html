<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Studyroom Admin</title>
<style>
:root{--bg:#ffffff;--cd:#fff;--tx:#000;--mu:#6e6e6e;--pr:#000;--pl:#f1f1f1;--bd:#d8d8d8;--er:#c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app,.wrap{max-width:520px;margin:0 auto}.wrap{padding:18px 18px 24px}.wrap.pn{padding-bottom:100px}
h1{font-size:30px;font-weight:800;margin:0;color:var(--pr)}h2{font-size:26px;font-weight:800;margin:6px 0 14px;color:var(--pr)}h3{font-size:19px;margin:20px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;padding:14px 18px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--pr);color:var(--pr);display:grid;place-items:center;font-weight:800;font-size:20px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.f{background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;padding:9px 14px;margin:12px 0}.f label{display:block;margin:0 0 2px;font-size:14px;font-weight:700;color:var(--tx)}
.f input,.f select{border:0;padding:3px 0;background:transparent;outline:0;color:var(--tx);width:100%;font:inherit;box-sizing:border-box}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font:inherit}
.sb{border-radius:16px;background:var(--pl);border:0}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--pr);color:#fff;font:700 17px system-ui}
button.g,button.o{background:var(--cd);color:var(--pr);border:1.5px solid var(--pr)}button.s{width:auto;padding:7px 14px;margin:0;font-size:14px;border-radius:10px}
.er{color:var(--er);min-height:1.2em;font-size:14px;margin:6px 0 0}.note{background:var(--pl);border-radius:14px;padding:12px;font-size:14px}
.big{font-size:30px;font-weight:800}.mu{color:var(--mu);font-size:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}.row:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .c{margin:0}
.splash{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.splash p{margin:4px 0;color:var(--tx)}
.seg{display:flex;background:var(--pl);border-radius:14px;padding:4px;gap:4px}.seg button{margin:0;padding:10px;background:none;color:var(--pr);font-size:15px}.seg button.on{background:var(--pr);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:12px;background:var(--cd);border:1.5px solid var(--bd);color:var(--pr);font-weight:700;font-size:14px;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}.th{height:80px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:32px}
.hero{background:linear-gradient(135deg,#000,#333);color:#fff;border-radius:22px;padding:22px;margin:8px 0 14px}.hero .big,.hero .mu{color:#fff}
.ok{width:92px;height:92px;border-radius:50%;background:var(--pl);display:grid;place-items:center;margin:20px auto 10px;font-size:44px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;max-width:520px;margin:0 auto;background:var(--pl);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{width:auto;margin:0;background:none;color:var(--mu);padding:6px 16px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font:600 12px system-ui}.nav button span{font-size:22px}.nav button.on{background:var(--pr);color:#fff}

input[type=checkbox]{accent-color:#000;width:20px!important;height:20px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes ltr{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:none}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,.35)}50%{box-shadow:0 0 0 7px rgba(0,0,0,0)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.wrap>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.wrap>*:nth-child(2){animation-delay:.07s}.wrap>*:nth-child(3){animation-delay:.14s}.wrap>*:nth-child(4){animation-delay:.21s}.wrap>*:nth-child(5){animation-delay:.28s}.wrap>*:nth-child(n+6){animation-delay:.35s}
.grid .c{animation:rise .55s both}.grid .c:nth-child(2){animation-delay:.1s}.grid .c:nth-child(3){animation-delay:.2s}.grid .c:nth-child(4){animation-delay:.3s}
.row{animation:slide .4s both}.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.1s}.row:nth-child(4){animation-delay:.15s}.row:nth-child(n+5){animation-delay:.2s}
.c,button,.f{transition:transform .2s,box-shadow .25s,background .2s,color .2s,border-color .2s}
.c:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.14);border-color:#000}
.f:focus-within{border-color:#000;box-shadow:0 0 0 3px rgba(0,0,0,.1);transform:translateY(-1px)}
button:hover{background:#222}button.g:hover,button.o:hover{background:#000;color:#fff}button:active{transform:scale(.96)}
button.s{animation:pulse 2s infinite}
.nav{box-shadow:0 -6px 24px rgba(0,0,0,.08)}.nav button{animation:none}.nav button:hover{background:#e6e6e6;color:#000}.nav button.on{transform:translateY(-4px);animation:none}.nav button.on:hover{background:#000;color:#fff}
.nav button span{transition:transform .25s}.nav button.on span{transform:scale(1.2)}
.er:not(:empty){animation:shake .4s}
.noanim *{animation:none!important}
#intro{position:fixed;inset:0;z-index:99;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:transform .8s cubic-bezier(.76,0,.24,1)}
#intro.go{transform:translateY(-100%)}
#intro h1{color:#fff;font-size:44px;display:flex;overflow:hidden;padding:4px 2px}#intro h1 span{display:inline-block;animation:ltr .6s calc(.2s + var(--i)*.06s) both cubic-bezier(.2,.9,.3,1)}
#intro p{margin:0;letter-spacing:.5em;font-size:12px;text-transform:uppercase;color:#aaa;opacity:0;animation:rise .6s 1s forwards}
#intro .ln{width:180px;height:2px;background:#333;overflow:hidden}#intro .ln i{display:block;width:100%;height:100%;background:#fff;animation:sweep 1s .1s infinite ease-in-out}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style><link rel="manifest" href="/admin-manifest.json"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="/admin-icon-192.png"><link rel="icon" href="/admin-icon-192.png"></head>
<body><div id="intro"><h1 id="iw"></h1><div class="ln"><i></i></div><p>Admin</p></div><div id="app"></div><script>
const $=s=>document.querySelector(s),v=i=>$("#"+i).value.trim(),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=n=>"KES "+Number(n||0).toLocaleString();
let T=localStorage.getItem("sr_a"),D,tab=0,anim=true;
async function api(p,b){const r=await fetch("/api/admin/"+p,{method:b===undefined?"GET":"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(T||"")},body:b===undefined?undefined:JSON.stringify(b)});
const d=await r.json().catch(()=>({}));if(r.status==401&&T){out();throw new Error("Please log in again.")}if(!r.ok)throw new Error(d.error||"Failed.");return d}
const R=(x,n)=>{const a=anim;anim=false;$("#app").className=a?"":"noanim";$("#app").innerHTML=`<div class="wrap${n?" pn":""}">${x}</div>${n||""}`;if(a)count()};
function count(){document.querySelectorAll(".big[data-n]").forEach(e=>{const t=+e.dataset.n,s=performance.now();(function f(n){const p=Math.min(1,(n-s)/1100);e.textContent=K(Math.round(t*(1-Math.pow(1-p,3))));p<1&&requestAnimationFrame(f)})(s)})}
const NAV=[["📊","Overview"],["👥","Affiliates"],["💬","Complaints"],["💸","Payouts"],["📁","Files"]];
const nav=a=>`<nav class="nav">${NAV.map((x,i)=>`<button class="${i==a?"on":""}" onclick="tab=${i};anim=true;show()"><span>${x[0]}</span>${x[1]}</button>`).join("")}</nav>`;
function out(){anim=true;T=null;localStorage.removeItem("sr_a");loginView()}
function loginView(){R(`<div class="splash"><h1 style="font-size:36px">Studyroom</h1><p>Admin</p></div><div class="f"><label>Email</label><input id="em" type="email" placeholder="Admin email"></div>
<div class="f"><label>Phone number</label><input id="ph" type="tel" placeholder="Admin phone"></div><div class="f"><label>Password</label><input id="pw" type="password" placeholder="Admin password"></div><p id="er" class="er"></p><button onclick="doLogin()">Log In</button>`)}
async function doLogin(){try{const d=await api("login",{email:v("em"),phone:v("ph"),password:$("#pw").value});T=d.token;localStorage.setItem("sr_a",T);load()}catch(e){$("#er").textContent=e.message}}
async function act(p,b){try{await api(p,b);await load()}catch(e){alert(e.message)}}
async function load(){D=await api("summary");show()}
let FL=[];
async function loadFiles(){try{FL=await api("files");$("#fl2").innerHTML=FL.map(f=>`<div class="row"><span>${esc(f.uni)} · ${esc(f.unit)} · ${esc(f.cat)}<br><b>${esc(f.title)}</b></span><span style="display:flex;gap:6px"><button class="s g" onclick="editFile(${f.id})">Edit</button><button class="s" onclick="delFile(${f.id})">Delete</button></span></div>`).join("")||`<span class="mu">Nothing uploaded yet.</span>`}catch(e){}}
async function delFile(id){if(!confirm("Delete this file?"))return;await fetch("/api/admin/file/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+T}});loadFiles()}
async function editFile(id){const f=FL.find(x=>x.id==id);if(!f)return;const a=[["University (exact name, or All)",f.uni],["Unit",f.unit],["Category: Notes, Past papers, CATs, Exams or Quizzes",f.cat],["Title",f.title]].map(x=>prompt(x[0],x[1]));if(a.includes(null))return;
const r=await fetch("/api/admin/file/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+T},body:JSON.stringify({uni:a[0],unit:a[1],cat:a[2],title:a[3]})});if(!r.ok)alert((await r.json().catch(()=>({}))).error||"Failed.");loadFiles()}
async function upFile(){const fs=[...$("#ff").files],tx=$("#fx").value.trim(),m=$("#fm"),b=$("#fb"),r=$("#fr");
const items=[...fs.map(f=>({n:f.name,t:f.type||(/\.pdf$/i.test(f.name)?"application/pdf":/\.txt$/i.test(f.name)?"text/plain":"application/octet-stream"),b:f})),...(tx?[{n:"Pasted text",t:"text/plain",b:new Blob([tx],{type:"text/plain"})}]:[])];
if(!items.length)return m.textContent="Choose a file or paste some text.";b.disabled=true;r.innerHTML="";
for(let i=0;i<items.length;i++){const it=items[i];m.textContent=`Sorting ${i+1} of ${items.length}…`;
try{if(it.b.size>25e6)throw new Error("Over 25 MB.");const x=await fetch("/api/admin/file?name="+encodeURIComponent(it.n),{method:"POST",headers:{"Content-Type":it.t,Authorization:"Bearer "+T},body:it.b}),d=await x.json().catch(()=>({}));if(x.status==401){out();return}if(!x.ok)throw new Error(d.error||"Upload failed.");
r.insertAdjacentHTML("beforeend",`<div class="c"><b>${esc(d.title)}</b><div class="mu">${esc(d.uni)} · ${esc(d.unit)} · ${esc(d.cat)}${d.ai?"":" · sorted by file name (AI not available)"}</div></div>`)}
catch(e){r.insertAdjacentHTML("beforeend",`<div class="c"><b>${esc(it.n)}</b><div class="er">${esc(e.message)}</div></div>`)}}
m.textContent="Done ✓";b.disabled=false;$("#ff").value="";$("#fx").value="";loadFiles()}
function show(){const d=D,pend=d.affs.filter(a=>!a.approved);let h="";
if(tab==0)h=`<div class="grid"><div class="c"><span class="mu">Main account</span><div class="big" data-n="${d.general||0}">${K(d.general)}</div></div><div class="c"><span class="mu">Affiliate accounts</span><div class="big" data-n="${d.owed||0}">${K(d.owed)}</div></div>
<div class="c"><span class="mu">Admin account</span><div class="big" data-n="${d.adminBal||0}">${K(d.adminBal)}</div></div><div class="c"><span class="mu">Paid to affiliates</span><div class="big" data-n="${d.paidout||0}">${K(d.paidout)}</div></div></div>
<p class="mu">${d.students} paying students · ${d.used} of 5000 codes used</p>
<div class="c"><label style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" style="width:auto" ${d.auto?"checked":""} onchange="act('auto',{on:this.checked})"> AI approves affiliates automatically</label></div>
<h3>Pending requests (${pend.length})</h3><div class="c">${pend.map(a=>`<div class="row"><span>${esc(a.email)}</span><button class="s" onclick="act('approve/${a.id}',{})">Approve</button></div>`).join("")||`<span class="mu">None.</span>`}</div>
<h3>Move to admin account</h3><div class="f"><label>Amount</label><input id="mv" type="number" min="1" placeholder="KES"></div><button onclick="act('transfer',{amount:+$('#mv').value})">Transfer from main account</button>`;
if(tab==1)h=`<h2>Affiliates (${d.affs.length})</h2><div class="c">${d.affs.map(a=>`<div class="row"><span>${esc(a.code||"no code")} · ${esc(a.phone)}</span><b>${K(a.bal)}</b></div>`).join("")||`<span class="mu">None yet.</span>`}</div>`;
if(tab==2)h=`<h2>Complaints</h2>${d.complaints.map(c=>`<div class="c"><b>${esc(c.type)}</b><div class="mu">${esc(c.email)}</div><p>${esc(c.msg)}</p>
${c.status=="Open"?`<div class="f"><label>Amount to credit (0 to just resolve)</label><input id="a${c.id}" type="number" min="0" placeholder="KES"></div><button onclick="act('credit',{id:${c.id},amount:+$('#a${c.id}').value||0})">Settle from main account</button>`:`<b>${esc(c.status)}</b>`}</div>`).join("")||`<p class="mu">No complaints.</p>`}`;
if(tab==3)h=`<h2>Payouts</h2><p class="mu">Automatic every Saturday at 6:00 AM. Next: ${new Date(d.next).toLocaleString()}</p><button onclick="if(confirm('Send all affiliate payouts now?'))act('payout-now',{})">Run payout now</button>
<div class="c">${d.payouts.map(p=>`<div class="row"><span>${esc(p.phone)} · ${esc(p.at)}</span><b>${K(p.amount)} ${esc(p.status)}</b></div>`).join("")||`<span class="mu">No payouts yet.</span>`}</div>`;
if(tab==4)h=`<h2>Upload files</h2><div class="f"><label>Files (PDF, image or text)</label><input id="ff" type="file" multiple accept="application/pdf,image/*,text/plain"></div><details class="c"><summary>Paste text instead</summary><div class="f"><textarea id="fx" rows="8" placeholder="Paste notes, or quiz questions with answers"></textarea></div></details><button id="fb" onclick="upFile()">Upload</button><p class="mu" id="fm">AI reads each file and sorts it by university, unit and category.</p><div id="fr"></div><h3>Uploaded</h3><div id="fl2" class="c"><span class="mu">Loading…</span></div>`;
R(`<div class="hd"><div><div class="mu">Admin</div><h1>Studyroom</h1></div><button class="g s" onclick="out()">Log out</button></div>`+h,nav(tab));if(tab==4)loadFiles()}
setInterval(()=>{if(T&&tab!=4&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||""))load().catch(()=>{})},3e4);
$("#iw").innerHTML="Studyroom".split("").map((c,i)=>`<span style="--i:${i}">${c}</span>`).join("");
setTimeout(()=>{$("#intro").classList.add("go");setTimeout(()=>$("#intro").remove(),1000)},1700);
T?load().catch(loginView):loginView();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script></body></html>
