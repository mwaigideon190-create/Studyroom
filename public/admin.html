<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Studyroom Admin</title>
<style>

:root[data-theme="dark"]{--bg:#000;--cd:#111;--tx:#fff;--mu:#b4b4b4;--pr:#fff;--pl:#1d1d1d;--bd:#3d3d3d;--ok:#43d28b;--on:#000;--a1:#3ddbc4;--a2:#ffb547;--a3:#ff6b72;--a4:#6ea8ff;--hb:#f7f7fb}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;transition:background .3s,color .3s}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}.wrap.pn{padding-bottom:150px}.page{animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(6px)}}@keyframes grow{from{width:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes dot{40%{transform:translateY(-5px);opacity:1}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
h1{font-size:28px;margin:0;color:var(--pr);font-weight:800}h2{font-size:24px;margin:4px 0 12px;color:var(--pr)}h3{font-size:18px;margin:20px 0 10px}.mu{color:var(--mu);font-size:14px}.big{font-size:30px;font-weight:800}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--pr);color:var(--pr);display:grid;place-items:center;font-weight:800;font-size:20px;cursor:pointer;flex:none}

.banner{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--a3);padding:14px 16px;border-radius:0 18px 18px 18px;display:flex;justify-content:space-between;align-items:center;animation:up .3s both}.banner b{font-size:28px;display:block;line-height:1.1}
.ar{margin-right:36px}.al{margin-left:36px}.am{margin:0 18px 0 8px}.an{margin-left:14px;margin-right:52px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chip{flex:none;padding:9px 16px;border-radius:0 12px 12px 12px;background:var(--cd);border:1.5px solid var(--bd);color:var(--pr);font-weight:700;font-size:14px;cursor:pointer;transition:.2s}.chip.on{background:var(--pr);color:var(--on);border-color:var(--pr)}.chip:active,.k:active,.nav button:active{transform:scale(.96)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;padding-bottom:22px}.cards .k:nth-child(even){margin-top:22px}.cards .k:nth-child(odd) .th{height:88px}.cards .k:nth-child(even) .th{height:56px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:0 18px 18px 18px;padding:10px;animation:up .4s both;transition:transform .15s;cursor:pointer}.k b{display:block}.th{height:70px;border-radius:0 12px 12px 12px;display:grid;place-items:center;font-size:30px;margin-bottom:8px;background:var(--pl);background:color-mix(in srgb,var(--c,var(--pr)) 16%,var(--bg))}
.bar{height:6px;border-radius:6px;background:var(--pl);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:var(--w);background:var(--c,var(--pr));border-radius:6px;animation:grow .9s ease both}
.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);padding:12px 0;animation:up .3s both}.row .ic{font-size:24px}.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;overflow-wrap:anywhere}
.gm{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);cursor:pointer;animation:up .3s both}.gm .ic{font-size:24px;width:30px;text-align:center}.gm>div{flex:1}.gm b{display:block}
.card{border-bottom:1px solid var(--bd);padding:12px 0;margin:6px 0;animation:up .35s both}.card.bx,.c{background:var(--cd);border:1px solid var(--bd);border-radius:0 18px 18px 18px;padding:14px;margin:10px 0}
.dl{border:0;background:var(--pl);color:var(--pr);border-radius:0 12px 12px 12px;padding:9px 12px;font:700 14px system-ui;cursor:pointer;transition:.2s}.dl.on{background:var(--ok);color:#fff}mark{background:#ffe08a;color:#000;padding:0 2px}
.tag{font-size:11px;font-weight:700;color:var(--c);border:1px solid var(--c);padding:1px 7px;border-radius:0 8px 8px 8px;margin-right:6px}.soon{font-size:11px;background:var(--pl);color:var(--pr);padding:2px 7px;font-weight:700}
.lnk{float:right;font-size:14px;color:var(--pr);cursor:pointer;font-weight:700}.lm{flex:none;min-width:92px;padding:6px 14px 8px 0;border-bottom:2px solid var(--c,var(--bd));cursor:pointer;color:var(--tx);text-decoration:none}.lm span{font-size:26px}.lm b{display:block;font-size:14px;margin-top:4px}
.ring{--p:60;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--pr) calc(var(--p)*1%),var(--pl) 0);display:grid;place-items:center;position:relative;flex:none}.ring::before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--cd)}.ring b{position:relative}
.seg{display:flex;background:var(--pl);border-radius:0 14px 14px 14px;padding:4px;gap:4px}.seg button{flex:1;border:0;background:none;color:var(--pr);padding:10px;border-radius:0 10px 10px 10px;font:700 15px system-ui;cursor:pointer}.seg button.on{background:var(--pr);color:var(--on)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.hero2{--tx:#1d1340;--mu:#5d5780;--pr:#4a1bc4;--bd:#d9cfff;--a1:#0f9d8a;--a2:#c97800;--a4:#2f6fed;position:relative;overflow:hidden;padding:18px;min-height:230px;display:flex;flex-direction:column;justify-content:space-between;background:var(--hb);color:var(--tx);border:1px solid var(--bd);border-radius:0 22px 22px 22px;animation:up .3s both}
.hero2>*{position:relative;z-index:2}.hero2 .vbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.42;z-index:0}.hero2::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.12) 45%,rgba(255,255,255,.65))}
.stats{display:flex;gap:18px;font-size:13px;color:var(--mu);flex-wrap:wrap}.stats b{font-size:18px;margin-right:4px}.stats div:nth-child(1) b{color:var(--a2)}.stats div:nth-child(2) b{color:var(--a1)}.stats div:nth-child(3) b{color:var(--a4)}
.f{border:1.5px solid var(--bd);border-radius:0 14px 14px 14px;padding:9px 14px;margin:12px 0;background:var(--cd)}.f label{display:block;font-size:14px;font-weight:700;margin:0 0 2px;color:var(--tx)}.f input,.f select,.f textarea{border:0;background:transparent;color:var(--tx);width:100%;font:inherit;outline:0;padding:3px 0}
.pb{display:block;width:100%;margin-top:12px;padding:14px;border:0;border-radius:0 14px 14px 14px;background:var(--pr);color:var(--on);font:700 17px system-ui;cursor:pointer}.pb:disabled{opacity:.6}.pb.o{background:var(--cd);color:var(--pr);border:1.5px solid var(--pr)}
.er{color:#d64545;min-height:1.2em;font-size:14px;margin:6px 0 0}.note{background:var(--pl);padding:12px;font-size:14px;border-radius:0 14px 14px 14px}.splash{min-height:46vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.splash p{margin:4px 0}
.okc{width:92px;height:92px;border-radius:50%;background:var(--pl);color:var(--ok);display:grid;place-items:center;margin:20px auto 10px;font-size:44px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .c{margin:0}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-around;background:var(--pl);border-radius:22px 22px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{border:0;background:none;color:var(--mu);padding:6px 10px;border-radius:0 14px 14px 14px;display:flex;flex-direction:column;align-items:center;font:600 11px system-ui;cursor:pointer;transition:.2s}.nav button span{font-size:21px}.nav button.on{background:var(--pr);color:var(--on)}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border:0;border-radius:50%;z-index:6;background:var(--pr);color:var(--on);font-size:24px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,5,30,.45);display:none}.sheet.open{display:block}.pane{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:82%;background:var(--bg);color:var(--tx);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .3s both;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--bd)}.ph>div:nth-child(2){flex:1}.orb{width:34px;height:34px;border-radius:50%;background:conic-gradient(var(--pr),var(--pl),var(--pr));flex:none}
#msgs{flex:1;overflow:auto;padding:14px 16px}.b{max-width:85%;padding:10px 14px;margin:8px 0;white-space:pre-wrap;animation:up .25s both}.b.a{background:var(--pl);border-radius:0 18px 18px 18px}.b.u{background:var(--pr);color:var(--on);margin-left:auto;border-radius:18px 0 18px 18px}
.typ i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pr);margin:0 2px;opacity:.4;animation:dot 1s infinite}.typ i:nth-child(2){animation-delay:.15s}.typ i:nth-child(3){animation-delay:.3s}
.in{display:flex;gap:8px;padding:10px 16px}.in input{flex:1;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:0 14px 14px 14px;padding:12px;font:inherit}.in button{border:0;background:var(--pr);color:var(--on);border-radius:0 12px 12px 12px;padding:0 18px;font:700 16px system-ui}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:0 12px 12px 12px;font-size:14px;z-index:30;animation:up .25s both}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:0 14px 14px 14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font:600 15px system-ui;cursor:pointer}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:#d64545;color:#fff;border-color:#d64545;animation:shake .35s}
.fc{perspective:900px;height:200px;margin:14px 0}.fci{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.fci.f{transform:rotateY(180deg)}.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0 18px 18px 18px;display:grid;place-items:center;padding:18px;text-align:center;font-weight:800;font-size:21px}.fcf{background:var(--pl);color:var(--pr)}.fcb{background:var(--pr);color:var(--on);transform:rotateY(180deg);font-size:17px;font-weight:700}
.wrap{padding:0 0 40px}.wrap.pn{padding-bottom:150px}.page.pad{padding:16px}
.hero2{border-width:0 0 1px;border-radius:0 0 24px 24px}.page.pad .hero2{border-width:1px;border-radius:0 22px 22px 22px}
.page:not(.pad)>h2,.page:not(.pad)>h3,.page:not(.pad)>p,.page:not(.pad)>.chips{padding-left:14px;padding-right:14px}.page:not(.pad)>.seg{margin:0 14px}
.page:not(.pad) .ar,.page:not(.pad) .al,.page:not(.pad) .am,.page:not(.pad) .an{margin-left:0;margin-right:0}.page:not(.pad) .sb{width:100%;margin:12px 0;border-radius:0}
.page:not(.pad) .banner{border-right:0;border-radius:0;margin:12px 0}.page:not(.pad) .card.bx{border-left:0;border-right:0;border-radius:0}
.page:not(.pad) .cards{gap:2px}.page:not(.pad) .cards .k:nth-child(odd){border-left:0;border-radius:0 18px 18px 0}.page:not(.pad) .cards .k:nth-child(even){border-right:0;border-radius:18px 0 0 18px}
.page:not(.pad) .row,.page:not(.pad) .gm,.page:not(.pad) .card:not(.bx){padding:12px 14px;border-bottom:0;position:relative}
.page:not(.pad) .row::after,.page:not(.pad) .gm::after,.page:not(.pad) .card:not(.bx)::after{content:"";position:absolute;left:14px;bottom:0;width:58%;height:1px;background:var(--bd)}
.cir{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;position:relative;flex:none;perspective:90px;overflow:hidden}
.mf{width:15px;height:21px;border-radius:0 4px 4px 4px;background:var(--pr);animation:flp 1.3s ease-in-out infinite alternate}
@keyframes flp{0%{transform:rotateY(0);background:var(--pr)}49%{background:var(--pr)}50%{background:var(--a2)}100%{transform:rotateY(180deg);background:var(--a2)}}
.zap{font-size:19px;animation:zp 1.1s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.3) rotate(-8deg);opacity:.65}}
.mm{display:grid;grid-template-columns:10px 10px;gap:3px}.mm i{width:10px;height:10px;border-radius:2px;background:var(--bd);animation:mt 2s infinite}.mm i:nth-child(2),.mm i:nth-child(3){animation-delay:1s}
@keyframes mt{0%,45%{background:var(--bd)}55%,95%{background:var(--a1)}100%{background:var(--bd)}}
.rc{position:absolute;inset:3px;border-radius:50%;border:2px solid transparent;border-top-color:var(--a3);border-right-color:var(--a3);animation:spin 1.2s linear infinite}
.earn{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#4a1bc4,#8a5cff);padding:18px 14px;margin:14px 0;cursor:pointer}.earn .big{color:#fff}
.coin{position:absolute;bottom:-24px;font-size:22px;animation:rise 3.4s linear infinite}@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-170px) rotate(40deg);opacity:0}}
.earnbtn{display:inline-block;background:#fff;color:#4a1bc4;font-weight:800;padding:10px 16px;border-radius:0 12px 12px 12px;animation:pls 1.8s ease-in-out infinite}@keyframes pls{50%{box-shadow:0 0 0 8px rgba(255,255,255,.25)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),v=i=>$("#"+i).value.trim(),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const K=n=>"KES "+Number(n||0).toLocaleString();
let T=null;try{T=sessionStorage.getItem("sr_a")}catch(e){}
let D,tab=0;
async function api(p,b){const r=await fetch("/api/admin/"+p,{method:b===undefined?"GET":"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(T||"")},body:b===undefined?undefined:JSON.stringify(b)});
const d=await r.json().catch(()=>({}));if(r.status==401&&T){out();throw new Error("Please log in again.")}if(!r.ok)throw new Error(d.error||"Failed.");return d}
const R=(x,n)=>{$("#app").innerHTML=`<div class="wrap${n?" pn":""}"><div class="page pad">${x}</div></div>${n||""}`};
const NAV=[["📊","Overview"],["📚","Content"],["👥","Accounts"],["💬","Complaints"],["💸","Payouts"]];
const nav=a=>`<nav class="nav">${NAV.map((x,i)=>`<button class="${i==a?"on":""}" onclick="tab=${i};show()"><span>${x[0]}</span>${x[1]}</button>`).join("")}</nav>`;
function out(){T=null;try{sessionStorage.removeItem("sr_a")}catch(e){}loginView()}
function loginView(){R(`<div class="splash"><h1 style="font-size:36px">Studyroom</h1><p>Admin</p></div><div class="f"><label>Email</label><input id="em" type="email" placeholder="Admin email"></div>
<div class="f"><label>Phone number</label><input id="ph" type="tel" placeholder="Admin phone"></div><div class="f"><label>Password</label><input id="pw" type="password" placeholder="Admin password"></div><p id="er" class="er"></p><button class="pb" onclick="doLogin()">Log In</button>`)}
async function doLogin(){try{const d=await api("login",{email:v("em"),phone:v("ph"),password:$("#pw").value});T=d.token;try{sessionStorage.setItem("sr_a",T)}catch(e){}load()}catch(e){$("#er").textContent=e.message}}
async function act(p,b){try{await api(p,b);await load()}catch(e){alert(e.message)}}
async function load(){const[s,c,u]=await Promise.all([api("summary"),api("content"),api("users?q="+encodeURIComponent((D&&D.q)||""))]);D={...s,c,users:u,q:(D&&D.q)||""};show()}
async function srch(){D.q=v("sq");D.users=await api("users?q="+encodeURIComponent(D.q));show()}
async function upload(){const f=$("#fl").files[0];if(!f)return alert("Choose a PDF file.");if(f.size>10e6)return alert("Keep the file under 10 MB.");const b=$("#ub");b.disabled=true;b.textContent="Uploading…";
const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(f)});
try{await api("file",{unit:v("fu"),type:v("ft"),title:v("fti"),pages:+v("fp")||0,data});await load()}catch(e){alert(e.message);b.disabled=false;b.textContent="Upload"}}
const del=(p,b,m)=>{if(confirm(m))act(p,b)};
function show(){const d=D,pend=d.affs.filter(a=>!a.approved),c=d.c;let h="";
if(tab==0)h=`<div class="grid"><div class="c"><span class="mu">Main account</span><div class="big">${K(d.general)}</div></div><div class="c"><span class="mu">Affiliate accounts</span><div class="big">${K(d.owed)}</div></div>
<div class="c"><span class="mu">Admin account</span><div class="big">${K(d.adminBal)}</div></div><div class="c"><span class="mu">Paid to affiliates</span><div class="big">${K(d.paidout)}</div></div></div>
<p class="mu">${d.students} paying students · ${d.used} of 5000 codes used</p>
<div class="c"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${d.auto?"checked":""} onchange="act('auto',{on:this.checked})"> AI approves affiliates automatically</label></div>
<h3>Pending requests (${pend.length})</h3><div class="c">${pend.map(a=>`<div class="row"><span style="flex:1">${esc(a.email)}</span><button class="dl" onclick="act('approve/${a.id}',{})">Approve</button></div>`).join("")||`<span class="mu">None.</span>`}</div>
<h3>Move to admin account</h3><div class="f"><label>Amount</label><input id="mv" type="number" min="1" placeholder="KES"></div><button class="pb" onclick="act('transfer',{amount:+$('#mv').value})">Transfer from main account</button>`;
if(tab==1)h=`<h2>Content</h2><p class="mu">Students see only what you add here. Nothing is added by default.</p>
<h3>Units (${c.units.length})</h3><div class="f"><label>Unit code</label><input id="uc" placeholder="e.g. BACS 122"></div><div class="f"><label>Unit name</label><input id="un" placeholder="e.g. Elements of Risk and Insurance"></div><button class="pb" onclick="act('unit',{code:v('uc'),name:v('un')})">Add unit</button>
<div class="c">${c.units.map(u=>`<div class="row"><span style="flex:1"><b>${esc(u.code)}</b> ${esc(u.name)}</span><button class="dl" onclick="del('unit/delete',{code:'${esc(u.code)}'},'Delete this unit and all its files?')">Delete</button></div>`).join("")||`<span class="mu">No units yet.</span>`}</div>
<h3>Upload a file</h3>${c.units.length?`<div class="f"><label>Unit</label><select id="fu">${c.units.map(u=>`<option value="${esc(u.code)}">${esc(u.code)} · ${esc(u.name)}</option>`).join("")}</select></div>
<div class="f"><label>Type</label><select id="ft"><option>Notes</option><option>Past papers</option><option>CATs</option><option>Exams</option><option>Quizzes</option></select></div>
<div class="f"><label>Title</label><input id="fti" placeholder="e.g. CAT 1, 2024"></div><div class="f"><label>Pages (optional)</label><input id="fp" type="number" min="0"></div><div class="f"><label>PDF file (under 10 MB)</label><input id="fl" type="file" accept="application/pdf"></div>
<button class="pb" id="ub" onclick="upload()">Upload</button><p class="mu">Only upload material you own or have permission to use.</p>`:`<p class="mu">Add a unit first.</p>`}
<h3>Files (${c.files.length})</h3><div class="c">${c.files.map(f=>`<div class="row"><span style="flex:1"><b>${esc(f.title)}</b><br><span class="mu">${esc(f.unit)} · ${esc(f.type)} · ${f.pages||0} pages</span></span><button class="dl" onclick="del('file/delete',{id:${f.id}},'Delete this file?')">Delete</button></div>`).join("")||`<span class="mu">No files yet.</span>`}</div>
<h3>Exams and CATs dates</h3><div class="f"><label>Title</label><input id="et" placeholder="e.g. BACS 122 CAT 1"></div><div class="f"><label>Date</label><input id="ed" type="date"></div><button class="pb" onclick="act('event',{title:v('et'),date:v('ed')})">Add date</button>
<div class="c">${c.events.map(e=>`<div class="row"><span style="flex:1">${esc(e.title)} · ${esc(e.date)}</span><button class="dl" onclick="del('event/delete',{id:${e.id}},'Delete this date?')">Delete</button></div>`).join("")||`<span class="mu">No dates yet.</span>`}</div>`;
if(tab==2)h=`<h2>Accounts</h2><div class="f"><label>Search by email or phone</label><input id="sq" value="${esc(d.q)}" placeholder="Search"></div><button class="pb" onclick="srch()">Search</button>
<div class="c">${d.users.map(u=>`<div class="row"><span style="flex:1"><b>${esc(u.email)}</b><br><span class="mu">${u.role=="aff"?"Affiliate "+esc(u.code||"(no code)")+" · "+K(u.bal):"Reader · "+(u.paid?"paid":"not paid")} · ${esc(u.phone)}</span></span>${u.active?`<button class="dl" onclick="del('reset-device/${u.id}',{},'Log this account out of its device?')">Reset device</button>`:`<span class="mu">no device</span>`}</div>`).join("")||`<span class="mu">No accounts found.</span>`}</div>`;
if(tab==3)h=`<h2>Complaints</h2>${d.complaints.map(c=>`<div class="c"><b>${esc(c.type)}</b><div class="mu">${esc(c.email)}</div><p>${esc(c.msg)}</p>
${c.status=="Open"?`<div class="f"><label>Amount to credit (0 to just resolve)</label><input id="a${c.id}" type="number" min="0" placeholder="KES"></div><button class="pb" onclick="act('credit',{id:${c.id},amount:+$('#a${c.id}').value||0})">Settle from main account</button>`:`<b>${esc(c.status)}</b>`}</div>`).join("")||`<p class="mu">No complaints.</p>`}`;
if(tab==4)h=`<h2>Payouts</h2><p class="mu">Automatic every Saturday at 6:00 AM. Next: ${new Date(d.next).toLocaleString()}</p><button class="pb" onclick="if(confirm('Send all affiliate payouts now?'))act('payout-now',{})">Run payout now</button>
<div class="c">${d.payouts.map(p=>`<div class="row"><span style="flex:1">${esc(p.phone)} · ${esc(p.at)}</span><b>${K(p.amount)} ${esc(p.status)}</b></div>`).join("")||`<span class="mu">No payouts yet.</span>`}</div>`;
R(`<div class="hd"><div><div class="mu">Admin</div><h1>Studyroom</h1></div><button class="dl" onclick="out()">Log out</button></div>`+h,nav(tab))}
setInterval(()=>{if(T&&!/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||""))load().catch(()=>{})},3e4);
T?load().catch(loginView):loginView();
</script></body></html>
