// ---- study assistant
function say(t,c){const b=document.createElement("div");b.className="b "+c;b.textContent=t;$("#msgs").append(b);$("#msgs").scrollTop=1e9;return b}
async function ask(q){q=q.trim();if(!q)return;say(q,"u");AH.push({role:"user",content:q});$("#ai").value="";const t=say("","a typ");t.innerHTML="<i></i><i></i><i></i>";
try{const MY=P.my||[],d=await api("ai",{messages:AH.slice(-8),units:CT.units.filter(u=>MY.includes(u.code)).map(u=>u.code+" "+u.name)});t.remove();say(d.reply,"a");AH.push({role:"assistant",content:d.reply})}catch(e){t.remove();say(e.message,"a");AH.pop()}}
$("#fab").onclick=()=>{$("#sheet").classList.add("open");if(!$("#msgs").children.length)say("Hi, I’m your study assistant. Ask me about a unit, a topic or how to revise.","a");$("#ai").focus()};
$("#x").onclick=()=>$("#sheet").classList.remove("open");$("#sheet").onclick=e=>{if(e.target.id=="sheet")$("#sheet").classList.remove("open")};
$("#qp").innerHTML=["Explain this topic simply","Plan my CAT revision","Quiz me"].map(x=>`<span class="chip">${x}</span>`).join("");$("#qp").onclick=e=>{if(e.target.classList.contains("chip"))ask(e.target.textContent)};
$("#send").onclick=()=>ask($("#ai").value);$("#ai").onkeydown=e=>{if(e.key=="Enter")ask(e.target.value)};
// ---- clicks
document.addEventListener("click",async e=>{const g=s=>e.target.closest(s);let x;
if(x=g("[data-th]")){theme(x.dataset.th);view()}
else if(x=g("[data-u]")){const c=x.dataset.u;P.my=P.my||[];P.my=P.my.includes(c)?P.my.filter(k=>k!=c):[...P.my,c];SP();x.classList.toggle("on")}
else if(x=g("[data-i]")){const i=+x.dataset.i;await saveF(i);const f=FL[i];x.classList.toggle("on",sv(f));x.textContent=sv(f)?"✓ Saved":"⬇ Save";if(S.tab=="dl")setTimeout(view,250)}
else if(x=g("[data-open]"))openF(+x.dataset.open);
else if(x=g("[data-c]")){S.cat=x.dataset.c;view()}
else if(x=g("[data-s]")){S.q=x.dataset.s;go("search")}
else if(x=g("[data-act]"))act(x.dataset.act);
else if(x=g("[data-t]"))go(x.dataset.t)});
boot();
</script></body></html>
