<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Studyroom</title><style>
:root{--bg:#ffffff;--cd:#fff;--tx:#1d1340;--mu:#6b6590;--pr:#4a1bc4;--pl:#e4dbff;--bd:#d9cfff;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app,.wrap{max-width:520px;margin:0 auto}.wrap{padding:18px 18px 24px}.wrap.pn{padding-bottom:100px}
h1{font-size:30px;font-weight:800;margin:0;color:var(--pr)}h2{font-size:26px;font-weight:800;margin:6px 0 14px;color:var(--pr)}h3{font-size:19px;margin:20px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;padding:14px 18px 0}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.av{width:44px;height:44px;border-radius:50%;border:2px solid var(--pr);color:var(--pr);display:grid;place-items:center;font-weight:800;font-size:20px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.f{background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;padding:9px 14px;margin:12px 0}.f label{display:block;margin:0 0 2px;font-size:14px;font-weight:700;color:var(--tx)}
.f input,.f select{border:0;padding:3px 0;background:transparent;outline:0;color:var(--tx);width:100%;font:inherit;box-sizing:border-box}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1.5px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx);font:inherit}
.sb{border-radius:16px;background:var(--pl);border:0}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;background:var(--pr);color:#fff;font:700 17px system-ui}
button.g,button.o{background:var(--cd);color:var(--pr);border:1.5px solid var(--pr)}button.s{width:auto;padding:7px 14px;margin:0;font-size:14px;border-radius:10px}
.er{color:var(--er);min-height:1.2em;font-size:14px;margin:6px 0 0}.note{background:var(--pl);border-radius:14px;padding:12px;font-size:14px}
.big{font-size:30px;font-weight:800}.mu{color:var(--mu);font-size:14px}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:15px}.row:last-child{border:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .c{margin:0}
.splash{min-height:56vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.splash p{margin:4px 0;color:var(--tx)}
.seg{display:flex;background:var(--pl);border-radius:14px;padding:4px;gap:4px}.seg button{margin:0;padding:10px;background:none;color:var(--pr);font-size:15px}.seg button.on{background:var(--pr);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 16px;border-radius:12px;background:var(--cd);border:1.5px solid var(--bd);color:var(--pr);font-weight:700;font-size:14px;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px}.th{height:80px;border-radius:12px;background:var(--pl);display:grid;place-items:center;font-size:32px}
.hero{background:linear-gradient(135deg,#4a1bc4,#7b4dff);color:#fff;border-radius:22px;padding:22px;margin:8px 0 14px}.hero .big,.hero .mu{color:#fff}
.ok{width:92px;height:92px;border-radius:50%;background:var(--pl);display:grid;place-items:center;margin:20px auto 10px;font-size:44px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;max-width:520px;margin:0 auto;background:var(--pl);border-radius:22px 22px 0 0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{width:auto;margin:0;background:none;color:var(--mu);padding:6px 16px;border-radius:14px;display:flex;flex-direction:column;align-items:center;font:600 12px system-ui}.nav button span{font-size:22px}.nav button.on{background:var(--pr);color:#fff}
</style></head>
<body><div id="app"></div><script>
const $=s=>document.querySelector(s),v=i=>$("#"+i).value.trim(),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let T=localStorage.getItem("sr_t"),X={role:"stu"},tick;
const P=()=>{try{return JSON.parse(localStorage.getItem("sr_p"))||{}}catch(e){return{}}};
async function api(p,b){const r=await fetch("/api/"+p,{method:b===undefined?"GET":"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(T||"")},body:b===undefined?undefined:JSON.stringify(b)});
const d=await r.json().catch(()=>({}));if(r.status==401&&T){out();throw new Error("Please log in again.")}if(!r.ok)throw new Error(d.error||"Something went wrong.");return d}
const er=m=>{const e=$("#er");if(e)e.textContent=m||""};
async function run(f,b){er();if(b)b.disabled=true;try{await f()}catch(e){er(e.message);if(b)b.disabled=false}}
function R(x,n){clearInterval(tick);$("#app").innerHTML=`<div class="wrap${n?" pn":""}">${x}</div>${n||""}`;scrollTo(0,0)}
const nav=(a,it)=>`<nav class="nav">${it.map((i,k)=>`<button class="${k==a?"on":""}" onclick="${i[2]}"><span>${i[0]}</span>${i[1]}</button>`).join("")}</nav>`;
const sN=a=>nav(a,[["🏠","Home","boot()"],["🔍","Search","boot().then(()=>$('#sq')&&$('#sq').focus())"],["👤","Profile","profile()"]]);
const aN=a=>nav(a,[["🏠","Home","boot()"],["💬","Help","help()"],["👤","Profile","profile()"]]);
const back=f=>`<p style="margin:0 0 10px"><a href="#" onclick="${f};return false" style="color:var(--mu);text-decoration:none">‹ Back</a></p>`;
function out(){localStorage.removeItem("sr_t");T=null;X={role:"stu"};splash()}
const LOGO=`<svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#4a1bc4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--pr)"><path d="M12 2a5.5 5.5 0 0 0-5.5 5.5c0 3.6 5.5 8.5 5.5 8.5s5.5-4.9 5.5-8.5A5.5 5.5 0 0 0 12 2z"/><path d="M12 5.5v4M10 7.500h4"/><path d="M3 15c3 0 6 .5 9 3 3-2.5 6-3 9-3v5c-3 0-6 .5-9 3-3-2.5-6-3-9-3z"/></svg>`;
function splash(){R(`<div class="splash">${LOGO}<h1 style="font-size:40px">Studyroom</h1><p>Past papers, notes and quizzes for first years</p></div>
<button onclick="signup()">Create Account</button><button class="o" onclick="login()">Log In</button>`)}
function signup(){const r=X.role;R(`${back("splash()")}<h2>Create Account</h2>
<div class="seg"><button id="b1" class="${r=="stu"?"on":""}" onclick="setRole('stu')">Reading account</button><button id="b2" class="${r=="aff"?"on":""}" onclick="setRole('aff')">Affiliate account</button></div>
<div class="f"><label>Mobile number (M-Pesa)</label><input id="ph" type="tel" placeholder="07XX XXX XXX"></div>
<div class="f"><label>Email</label><input id="em" type="email" placeholder="Enter your email"></div>
<div class="f"><label>Password</label><input id="pw" type="password" placeholder="Create a password (6+ characters)"></div>
<div class="f" id="rfw" ${r=="aff"?'style="display:none"':""}><label>Referral code (optional)</label><input id="rf" placeholder="1STUI00001"></div>
<p id="er" class="er"></p><button onclick="run(doSignup,this)">Sign Up</button><button class="o" onclick="login()">I already have an account</button>`)}
function setRole(r){X.role=r;$("#b1").classList.toggle("on",r=="stu");$("#b2").classList.toggle("on",r=="aff");$("#rfw").style.display=r=="stu"?"":"none"}
async function doSignup(){const d=await api("signup",{role:X.role,phone:v("ph"),email:v("em"),password:v("pw"),ref:X.role=="stu"?v("rf"):""});T=d.token;localStorage.setItem("sr_t",T);X.role=="stu"?setup():boot()}
function login(){R(`${back("splash()")}<h2>Log In</h2><div class="f"><label>Email</label><input id="em" type="email" placeholder="Enter your email"></div><div class="f"><label>Password</label><input id="pw" type="password" placeholder="Your password"></div>
<p id="er" class="er"></p><button onclick="run(doLogin,this)">Log In</button><button class="o" onclick="signup()">Create Account</button>`)}
async function doLogin(){const d=await api("login",{email:v("em"),password:v("pw")});T=d.token;localStorage.setItem("sr_t",T);boot()}
function setup(){const p=P();R(`<h2>Profile Setup</h2><div class="f"><label>Choose your university</label><select id="un">${["Egerton University","University of Nairobi","Kenyatta University","JKUAT","Moi University","Other"].map(u=>`<option${u==p.uni?" selected":""}>${u}</option>`).join("")}</select></div>
<h3>Study preferences</h3><div class="chips">${["Notes","Past papers","Quizzes"].map(c=>`<span class="chip${(p.pf||["Past papers"]).includes(c)?" on":""}" onclick="this.classList.toggle('on')">${c}</span>`).join("")}</div><button onclick="saveP()">Complete Profile</button>`)}
function saveP(){localStorage.setItem("sr_p",JSON.stringify({uni:$("#un").value,pf:[...document.querySelectorAll(".chips .on")].map(e=>e.textContent)}));boot()}
async function boot(){if(!T)return splash();try{const d=await api("me");X.me=d;d.role=="stu"?(d.paid?student(d):pay()):aff(d)}catch(e){if(T)splash()}}
function pay(){R(`<div class="hero"><div class="mu">Study Room access</div><div class="big">KES 150</div><p style="margin:6px 0 0">Unlock everything for your course</p></div>
<h3>What you get</h3><div class="chips"><span class="chip">📘 Notes</span><span class="chip">📄 Past papers</span><span class="chip">📝 CATs</span><span class="chip">✅ Quizzes</span></div>
<p class="mu">You will get an M-Pesa prompt on your phone. Enter your PIN to finish.</p><p id="er" class="er"></p><button onclick="run(doPay,this)">Pay KES 150 with M-Pesa</button>`)}
async function doPay(){await api("pay",{});er("Check your phone and enter your M-Pesa PIN…");let n=0;tick=setInterval(async()=>{n++;try{const d=await api("me");if(d.paid){clearInterval(tick);X.me=d;confirmed()}}catch(e){}if(n>40){clearInterval(tick);er("No payment received yet. Tap Pay to try again.");$("button").disabled=false}},3e3)}
function confirmed(){const d=X.me;R(`<div class="ok">✓</div><h2 style="text-align:center">Access Confirmed!</h2><p class="mu" style="text-align:center">Your Study Room is unlocked.</p>
<div class="c"><b>Summary</b><div class="row"><span>Plan</span><b>Study Room access</b></div><div class="row"><span>Date</span><b>${new Date().toLocaleDateString()}</b></div><div class="row"><span>Phone</span><b>${esc(d.phone)}</b></div><div class="row"><span>Total paid</span><b>KES 150 · Paid</b></div></div>
<button onclick="boot()">Done</button>`)}
function student(d){const p=P();R(`<div class="hd"><div><div class="mu">${esc(p.uni||"Welcome back")}</div><h1>Studyroom</h1></div><div class="av">${esc(d.email[0].toUpperCase())}</div></div>
<input id="sq" class="sb" placeholder="🔍 Search units or unit codes…" oninput="units()"><h3>Categories</h3>
<div class="chips" id="cats">${["All","Notes","Past papers","CATs","Quizzes"].map((c,i)=>`<span class="chip${i?"":" on"}" onclick="document.querySelectorAll('#cats .chip').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${c}</span>`).join("")}</div>
<h3>Year 1 units</h3><div class="cards" id="ul"></div>`,sN(0));units()}
function units(){const s=($("#sq")||{value:""}).value.toLowerCase();$("#ul").innerHTML=["Communication Skills","ICT and Computer Applications","Mathematics","Sociology","Entrepreneurship","Philosophy","HIV/AIDS Awareness","Development Studies"].filter(u=>u.toLowerCase().includes(s)).map(u=>`<div class="k"><div class="th">📘</div><b>${esc(u)}</b><span class="mu">Coming soon</span></div>`).join("")||`<p class="mu">No units found.</p>`}
function profile(){const d=X.me,p=P();R(`<h2>Profile</h2><div class="c"><div class="row"><span>Email</span><b>${esc(d.email)}</b></div><div class="row"><span>Phone</span><b>${esc(d.phone)}</b></div>${d.role=="stu"?`<div class="row"><span>University</span><b>${esc(p.uni||"Not set")}</b></div>`:""}</div>
${d.role=="stu"?`<button class="o" onclick="setup()">Edit study profile</button>`:""}<button onclick="out()">Log out</button>`,d.role=="stu"?sN(2):aN(2))}
function aff(d){if(!d.approved)return R(`<h2>Affiliate</h2><div class="c"><b>Waiting for your affiliate code</b><p class="mu">Your request has reached the admin. Log in again later to see your code.</p></div>`,aN(0));
R(`<div class="hd"><div><div class="mu">Affiliate</div><h1>Studyroom</h1></div><div class="av">${esc(d.email[0].toUpperCase())}</div></div>
<div class="hero"><div class="mu">Your referral code</div><div class="big">${esc(d.code)}</div></div>
<div class="c"><span class="mu">Payout waiting</span><div class="big">KES ${d.bal}</div><p class="mu">Sent to ${esc(d.phone)} every Saturday at 6:00 AM. Time left: <b id="cd"></b></p></div>
<div class="c"><b>Students you referred (${d.refs.length})</b>${d.refs.map(r=>`<div class="row"><span>****${esc(r.p)}</span><b>+KES 35</b></div>`).join("")||`<p class="mu">None yet.</p>`}</div>`,aN(0));
tick=setInterval(()=>{let s=Math.max(0,Math.floor((d.next-Date.now())/1e3));$("#cd").textContent=`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`},1e3)}
async function help(){const l=await api("complaints");R(`<h2>Help</h2><div class="f"><label>What is this about?</label><select id="ty"><option>Complaint about account affiliation</option><option>Complaint about affiliator account</option></select></div>
<div class="f"><label>Describe the problem</label><textarea id="ms" rows="4" style="border:0;padding:3px 0;background:transparent"></textarea></div><p id="er" class="er"></p><button onclick="run(doHelp,this)">Send to admin</button>
${l.map(c=>`<div class="c"><b>${esc(c.type)}</b><p class="mu">${esc(c.msg)}</p><b>${esc(c.status)}</b></div>`).join("")}`,aN(1))}
async function doHelp(){await api("complaints",{type:v("ty"),msg:v("ms")});help()}
boot();
</script></body></html>
